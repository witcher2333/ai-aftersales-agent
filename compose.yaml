services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-localroot}
      MYSQL_DATABASE: aftersales
      MYSQL_USER: aftersales
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-localdemo}
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p$$MYSQL_ROOT_PASSWORD"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]

  api:
    build: .
    environment:
      DB_URL: jdbc:mysql://mysql:3306/aftersales?useUnicode=true&characterEncoding=utf8&serverTimezone=UTC
      DB_USER: aftersales
      DB_PASSWORD: ${MYSQL_PASSWORD:-localdemo}
      REDIS_HOST: redis
      AI_ENDPOINT: ${AI_ENDPOINT:-}
      AI_API_KEY: ${AI_API_KEY:-}
      AI_MODEL: ${AI_MODEL:-}
      DEMO_SEED: ${DEMO_SEED:-true}
      DEMO_CUSTOMER_PASSWORD: ${DEMO_CUSTOMER_PASSWORD:-customer123}
      DEMO_AGENT_PASSWORD: ${DEMO_AGENT_PASSWORD:-agent123}
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_started
  web:
    build: ./web
    ports:
      - "127.0.0.1:${WEB_PORT:-8088}:80"
    depends_on:
      api:
        condition: service_started

volumes:
  mysql_data:
